<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boater Safety App v3.1 True Magnetic Switch</title>
<style>
body{font-family:Arial;margin:0;background:#0b2746;color:#fff}
body.night{background:#220000;color:#ffe0e0}
header{background:#081b30;padding:12px}
.wrap{padding:12px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:#12385f;padding:14px;border-radius:12px}
body.night .card{background:#3a0000}
button,a,input,textarea{
padding:10px 12px;border:none;border-radius:10px;
background:#1e6098;color:#fff;font:inherit
}
input,textarea{background:#fff;color:#000}
button{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.big{font-size:28px;font-weight:bold}
.small{font-size:13px;color:#d9ebff}
.light{
display:none;position:fixed;inset:0;z-index:999;
align-items:center;justify-content:center;
font-size:48px;font-weight:bold
}
.light.on{display:flex}
.light.white{background:#fff;color:#000}
.light.red{background:#b00000;color:#fff}
.light.dark{background:#000!important;color:#fff}
#readmeModal{
display:none;position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#12385f;padding:18px;border-radius:14px;
z-index:2000;width:min(90vw,500px)
}
#backdrop{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.6);z-index:1900
}
table{width:100%;border-collapse:collapse;background:#fff;color:#000}
td,th{padding:6px;border-bottom:1px solid #ccc}
</style>
</head>
<body>

<header>
<h1 id="title"></h1>
<div id="subtitle"></div>
</header>

<div class="wrap">

<div class="row" style="margin-bottom:12px">
<button id="langBtn">FR</button>
<button id="nightBtn"></button>
<button id="readmeBtn"></button>
</div>

<div class="grid">

<div class="card">
<h2 id="gpsTitle"></h2>
<div class="stack">
<button id="gpsBtn"></button>
<div class="big" id="pos">--</div>
<div>SOG: <span id="sog">--</span></div>
<div>COG: <span id="cog">--</span> <span id="northModeLabel">(TRUE)</span></div>
<button id="northModeBtn">Switch to Magnetic</button>
<div id="motion">--</div>
</div>
</div>

<div class="card">
<h2 id="mobTitle"></h2>
<div class="stack">
<button id="mobBtn"></button>
<button id="clearMobBtn"></button>
<div class="big" id="mobText">--</div>
</div>
</div>

<div class="card">
<h2 id="vhfTitle"></h2>
<div class="row">
<button id="maydayBtn"></button>
<button id="panpanBtn"></button>
<button id="securiteBtn">Open SECURITÉ</button>
</div>

<div id="maydayBox" style="display:none;background:#fff;color:#000;padding:10px;border-radius:10px;white-space:pre-wrap;margin-top:10px"></div>

<div id="panpanBox" style="display:none;background:#fff8d0;color:#000;padding:10px;border-radius:10px;white-space:pre-wrap;margin-top:10px"></div>
<div id="securiteBox" style="display:none;background:#dff6ff;color:#000;padding:10px;border-radius:10px;white-space:pre-wrap;margin-top:10px"></div>

</div>

<div class="card">
<h2 id="lightsTitle"></h2>
<div class="stack">
<div class="row">
<button id="whiteFlashBtn"></button>
<button id="whiteSolidBtn">White Solid</button>
</div>
<div class="row">
<button id="redFlashBtn"></button>
<button id="redSolidBtn">Red Solid</button>
</div>
<div class="row">
<button id="whiteSOSBtn"></button>
<button id="redSOSBtn"></button>
</div>
<button id="stopLightBtn"></button>
</div>
</div>

<div class="card">
<h2 id="fogTitle"></h2>
<div class="stack">
<button id="fogBtn"></button>
<div id="fogPanel" style="display:none">
<div class="big">SOG <span id="fogSog">--</span></div>
<div class="big">COG <span id="fogCog">--</span></div>
<div class="big">MOB <span id="fogMob">--</span></div>
</div>
</div>
</div>

<div class="card">
<h2 id="floatTitle"></h2>
<div class="stack">
<input id="floatName" placeholder="Trip / vessel name">
<textarea id="floatNotes" rows="4" placeholder="Route / emergency contact"></textarea>
<div class="row">
<input id="timerMin" type="number" value="60" style="width:90px">
<button id="timerBtn"></button>
<button id="timerStopBtn"></button>
</div>
<div class="big" id="timerDisplay">--:--</div>
<div class="row"><button id="saveFloatBtn"></button><button id="loadFloatBtn">Load Float Plan</button><button id="exportFloatBtn">Export TXT</button></div>
</div>
</div>

<div class="card">
<h2 id="noaaTitle"></h2>
<div class="stack">
<a target="_blank" href="https://www.ngdc.noaa.gov/geomag/calculators/mobileCompass.shtml" id="noaa1"></a>
<a target="_blank" href="https://www.ngdc.noaa.gov/geomag-web/" id="noaa2"></a>
</div>
</div>

<div class="card" style="grid-column:1/-1">
<h2 id="wpTitle"></h2>
<div class="row">
<input id="wpName" placeholder="Waypoint name" style="flex:1">
<button id="wpAddBtn"></button>
<button id="wpExportBtn"></button>
<button id="wpSaveBtn">Save WPs</button>
<button id="wpLoadBtn">Load WPs</button>
<button id="wpClearBtn"></button>
</div>

<table>
<thead>
<tr><th>Name</th><th>Lat</th><th>Lon</th><th>Time</th></tr>
</thead>
<tbody id="wpBody"></tbody>
</table>
</div>

</div>
</div>

<div id="backdrop"></div>

<div id="readmeModal">
<h2 id="readmeTitle"></h2>
<p id="rm1"></p>
<p id="rm2"></p>
<p id="rm3"></p>
<button id="closeReadmeBtn"></button>
</div>

<div class="light" id="light">SOS</div>

<script>
const $ = id => document.getElementById(id);

let lang='en';
let gps=null;
let mob=null;
let flashTimer=null;
let timerInt=null;
let waypoints=[];
let northMode='true';

const TXT={
en:{
title:'Boater Safety App v3.1 True Magnetic Switch',
subtitle:'Offline boating helper',
night:'Night Mode',
readme:'README',
close:'Close README',
gps:'GPS',
startGps:'Start GPS',
mob:'MOB',
markMob:'MARK MOB NOW',
clearMob:'Clear MOB',
vhf:'VHF Distress Helper',
maydayBtn:'Open MAYDAY',
panpanBtn:'Open PAN PAN',
securiteBtn:'Open SECURITÉ',
lights:'Emergency Lights',
whiteFlash:'Flashing White',
whiteSolid:'White Solid',
redFlash:'Flashing Red',
redSolid:'Red Solid',
whiteSOS:'White SOS',
redSOS:'Red SOS',
stopLight:'Stop Light',
fog:'Fog Mode',
fogBtn:'Toggle Big Digits',
float:'Float Plan + Timer',
startTimer:'Start Timer',
stop:'Stop',
saveFloat:'Save Float Plan',
loadFloat:'Load Float Plan',
exportFloat:'Export TXT',
noaa:'NOAA',
noaa1:'NOAA Compass Tool',
noaa2:'NOAA Calculator',
wp:'Waypoints',
markPos:'Mark Current Position',
exportCsv:'Export CSV',
saveWp:'Save WPs',
loadWp:'Load WPs',
clear:'Clear',
northTrue:'TRUE',
northMag:'MAG',
switchMag:'Switch to Magnetic',
switchTrue:'Switch to True',
readmeTitle:'README',
rm1:'This app is a boating helper only.',
rm2:'GPS works best outdoors.',
rm3:'NOAA links require internet access.',
mayday:`MAYDAY MAYDAY MAYDAY

This is [vessel name]

Position:
[location]

Nature of distress:
[fire/sinking/medical]

People aboard:
[number]

Need immediate assistance.
OVER.`,
securite:`SECURITÉ SECURITÉ SECURITÉ

All stations, all stations, all stations

This is [vessel name]

Navigation warning:

[fog / floating debris / disabled vessel / hazard]

Position:
[current location]

Exercise caution in this area.
OVER.`,

securite:`SECURITÉ SECURITÉ SECURITÉ

All stations, all stations, all stations

This is [vessel name]

Navigation warning:

[fog / floating debris / disabled vessel / hazard]

Position:
[current location]

Exercise caution in this area.
OVER.`,

panpan:`PAN PAN PAN PAN PAN PAN

All stations, all stations, all stations

This is [vessel name]

Position:
[current location]

We have a non-life-threatening problem.

Requesting assistance.
OVER.`
},
fr:{
title:'Application sécurité nautique v2.8',
subtitle:'Assistant nautique hors ligne',
night:'Mode nuit',
readme:'LIRE-MOI',
close:'Fermer LIRE-MOI',
gps:'GPS',
startGps:'Démarrer GPS',
mob:'MOB',
markMob:'MARQUER MOB',
clearMob:'Effacer MOB',
vhf:'Aide détresse VHF',
maydayBtn:'Ouvrir MAYDAY',
panpanBtn:'Ouvrir PAN PAN',
securiteBtn:'Ouvrir SECURITÉ',
lights:'Lumières urgence',
whiteFlash:'Blanc clignotant',
whiteSolid:'Blanc fixe',
redFlash:'Rouge clignotant',
redSolid:'Rouge fixe',
whiteSOS:'SOS blanc',
redSOS:'SOS rouge',
stopLight:'Arrêter lumière',
fog:'Mode brouillard',
fogBtn:'Basculer grands chiffres',
float:'Plan de route + minuterie',
startTimer:'Démarrer minuterie',
stop:'Arrêter',
saveFloat:'Sauvegarder plan',
loadFloat:'Charger plan',
exportFloat:'Exporter TXT',
noaa:'NOAA',
noaa1:'Compas NOAA',
noaa2:'Calculateur NOAA',
wp:'Points de route',
markPos:'Marquer position actuelle',
exportCsv:'Exporter CSV',
saveWp:'Sauver PR',
loadWp:'Charger PR',
clear:'Effacer',
northTrue:'VRAI',
northMag:'MAG',
switchMag:'Passer Magnétique',
switchTrue:'Passer Vrai',
readmeTitle:'LIRE-MOI',
rm1:'Cette application est une aide nautique seulement.',
rm2:'Le GPS fonctionne mieux à l’extérieur.',
rm3:'Les liens NOAA nécessitent Internet.',
mayday:`MAYDAY MAYDAY MAYDAY

Ici [nom du bateau]

Position :
[emplacement]

Nature de la détresse :
[feu/naufrage/médical]

Personnes à bord :
[nombre]

Besoin d’assistance immédiate.
TERMINE.`,
securite:`SECURITÉ SECURITÉ SECURITÉ

All stations, all stations, all stations

This is [vessel name]

Navigation warning:

[fog / floating debris / disabled vessel / hazard]

Position:
[current location]

Exercise caution in this area.
OVER.`,

securite:`SECURITÉ SECURITÉ SECURITÉ

Toutes stations, toutes stations, toutes stations

Ici [nom du bateau]

Avertissement à la navigation :

[brouillard / débris flottants / bateau en panne / danger]

Position :
[emplacement actuel]

Faire preuve de prudence dans ce secteur.
TERMINE.`,

panpan:`PAN PAN PAN PAN PAN PAN

Toutes stations, toutes stations, toutes stations

Ici [nom du bateau]

Position :
[emplacement actuel]

Nous avons un problème non mortel.

Demandons assistance.
TERMINE.`
}
};

function applyLang(){
const t=TXT[lang];
$('title').textContent=t.title;
$('subtitle').textContent=t.subtitle;
$('nightBtn').textContent=t.night;
$('readmeBtn').textContent=t.readme;
$('closeReadmeBtn').textContent=t.close;
$('gpsTitle').textContent=t.gps;
$('gpsBtn').textContent=t.startGps;
$('mobTitle').textContent=t.mob;
$('mobBtn').textContent=t.markMob;
$('clearMobBtn').textContent=t.clearMob;
$('vhfTitle').textContent=t.vhf;
$('maydayBtn').textContent=t.maydayBtn;
$('panpanBtn').textContent=t.panpanBtn;
$('securiteBtn').textContent=t.securiteBtn;
$('lightsTitle').textContent=t.lights;
$('whiteFlashBtn').textContent=t.whiteFlash;
$('whiteSolidBtn').textContent=t.whiteSolid;
$('redFlashBtn').textContent=t.redFlash;
$('redSolidBtn').textContent=t.redSolid;
$('whiteSOSBtn').textContent=t.whiteSOS;
$('redSOSBtn').textContent=t.redSOS;
$('stopLightBtn').textContent=t.stopLight;
$('fogTitle').textContent=t.fog;
$('fogBtn').textContent=t.fogBtn;
$('floatTitle').textContent=t.float;
$('timerBtn').textContent=t.startTimer;
$('timerStopBtn').textContent=t.stop;
$('saveFloatBtn').textContent=t.saveFloat;
$('loadFloatBtn').textContent=t.loadFloat;
$('exportFloatBtn').textContent=t.exportFloat;
$('noaaTitle').textContent=t.noaa;
$('noaa1').textContent=t.noaa1;
$('noaa2').textContent=t.noaa2;
$('wpTitle').textContent=t.wp;
$('wpAddBtn').textContent=t.markPos;
$('wpExportBtn').textContent=t.exportCsv;
$('wpSaveBtn').textContent=t.saveWp;
$('wpLoadBtn').textContent=t.loadWp;
$('wpClearBtn').textContent=t.clear;
$('readmeTitle').textContent=t.readmeTitle;
$('rm1').textContent=t.rm1;
$('rm2').textContent=t.rm2;
$('rm3').textContent=t.rm3;
$('maydayBox').textContent=t.mayday;
$('panpanBox').textContent=t.panpan;
$('securiteBox').textContent=t.securite;
$('northModeLabel').textContent =
northMode==='true' ? '('+t.northTrue+')' : '('+t.northMag+')';

$('northModeBtn').textContent =
northMode==='true' ? t.switchMag : t.switchTrue;

$('langBtn').textContent=lang==='en'?'FR':'EN';
}

$('langBtn').onclick=()=>{lang=lang==='en'?'fr':'en';applyLang();};

$('nightBtn').onclick=()=>document.body.classList.toggle('night');

$('readmeBtn').onclick=()=>{
$('backdrop').style.display='block';
$('readmeModal').style.display='block';
};

function closeReadme(){
$('backdrop').style.display='none';
$('readmeModal').style.display='none';
}
$('closeReadmeBtn').onclick=closeReadme;
$('backdrop').onclick=closeReadme;

$('fogBtn').onclick=()=>{
$('fogPanel').style.display=
$('fogPanel').style.display==='none'?'block':'none';
};


function getDisplayedHeading(trueHeading){

const magneticOffset = -10;

if(northMode==='mag'){
  return (trueHeading + magneticOffset + 360) % 360;
}

return trueHeading;
}

$('northModeBtn').onclick=()=>{

northMode = northMode==='true' ? 'mag' : 'true';

applyLang();

if(gps){
  const shown = Math.round(getDisplayedHeading(gps.heading||0));
  $('cog').textContent = shown + '°';
  $('fogCog').textContent = shown + '°';
}

};

$('gpsBtn').onclick=()=>{
if(!navigator.geolocation){alert('GPS unavailable');return;}
navigator.geolocation.watchPosition(p=>{
gps={
lat:p.coords.latitude,
lon:p.coords.longitude,
speed:p.coords.speed||0,
heading:p.coords.heading||0
};
$('pos').textContent=gps.lat.toFixed(5)+', '+gps.lon.toFixed(5);
$('sog').textContent=(gps.speed*1.94384).toFixed(1)+' kt';
const shownHeading = Math.round(getDisplayedHeading(gps.heading||0));
$('cog').textContent=shownHeading+'°';
$('motion').textContent=gps.speed>0.7?'Moving':'Slow/stationary';
$('fogSog').textContent=$('sog').textContent;
$('fogCog').textContent=shownHeading+'°';
},e=>alert('GPS Error: '+e.message),{enableHighAccuracy:true});
};

$('mobBtn').onclick=()=>{
if(!gps){alert('Start GPS first');return;}
mob={lat:gps.lat,lon:gps.lon};
$('mobText').innerHTML='STEER TO MOB<br>'+mob.lat.toFixed(5)+', '+mob.lon.toFixed(5);
$('fogMob').textContent='MOB';
};

$('clearMobBtn').onclick=()=>{
mob=null;
$('mobText').textContent='--';
$('fogMob').textContent='--';
};

$('maydayBtn').onclick=()=>{
$('maydayBox').style.display=
$('maydayBox').style.display==='block'?'none':'block';

$('securiteBox').style.display='none';
$('panpanBox').style.display='none';
$('securiteBox').style.display='none';
};


$('securiteBtn').onclick=()=>{

const securite = document.getElementById('securiteBox');
const mayday = document.getElementById('maydayBox');
const panpan = document.getElementById('panpanBox');

if(securite.style.display === 'block'){
    securite.style.display = 'none';
}else{
    securite.style.display = 'block';
}

mayday.style.display = 'none';
panpan.style.display = 'none';

};

$('panpanBtn').onclick=()=>{
$('panpanBox').style.display=
$('panpanBox').style.display==='block'?'none':'block';

$('securiteBox').style.display='none';
$('maydayBox').style.display='none';
};

function stopLight(){
clearTimeout(flashTimer);
$('light').className='light';
}

function flash(color){
stopLight();
const l=$('light');
l.classList.add('on',color);
let on=true;
function loop(){
l.classList.toggle('dark',!on);
on=!on;
flashTimer=setTimeout(loop,450);
}
loop();
}

function solid(color){

stopLight();

const l=$('light');

l.classList.add('on',color);

l.classList.remove('dark');

}


function morse(color){
stopLight();
const l=$('light');
l.classList.add('on',color);
const seq=[
{on:true,d:1},{on:false,d:1},
{on:true,d:1},{on:false,d:1},
{on:true,d:1},{on:false,d:3},
{on:true,d:3},{on:false,d:1},
{on:true,d:3},{on:false,d:1},
{on:true,d:3},{on:false,d:3},
{on:true,d:1},{on:false,d:1},
{on:true,d:1},{on:false,d:1},
{on:true,d:1},{on:false,d:7}
];
let i=0;
function step(){
const s=seq[i];
l.classList.toggle('dark',!s.on);
flashTimer=setTimeout(()=>{
i=(i+1)%seq.length;
step();
},s.d*250);
}
step();
}

$('whiteFlashBtn').onclick=()=>flash('white');
$('whiteSolidBtn').onclick=()=>solid('white');
$('redFlashBtn').onclick=()=>flash('red');
$('redSolidBtn').onclick=()=>solid('red');
$('whiteSOSBtn').onclick=()=>morse('white');
$('redSOSBtn').onclick=()=>morse('red');
$('stopLightBtn').onclick=stopLight;
$('light').onclick=stopLight;

$('timerBtn').onclick=()=>{
clearInterval(timerInt);
let secs=(parseInt($('timerMin').value)||60)*60;
function tick(){
const m=Math.floor(secs/60);
const s=secs%60;
$('timerDisplay').textContent=
String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
if(secs<=0){
$('timerDisplay').textContent='OVERDUE';
clearInterval(timerInt);
}
secs--;
}
tick();
timerInt=setInterval(tick,1000);
};

$('timerStopBtn').onclick=()=>{
clearInterval(timerInt);
$('timerDisplay').textContent='--:--';
};

$('saveFloatBtn').onclick=()=>{
localStorage.setItem('floatPlan',JSON.stringify({
name:$('floatName').value,
notes:$('floatNotes').value
}));
alert('Float plan saved');
};

$('loadFloatBtn').onclick=()=>{

const data = localStorage.getItem('floatPlan');

if(!data){
alert('No saved float plan found');
return;
}

try{
const fp = JSON.parse(data);

$('floatName').value = fp.name || '';
$('floatNotes').value = fp.notes || '';

alert('Float plan loaded');

}catch(err){
alert('Error loading float plan');
}
};

$('exportFloatBtn').onclick=()=>{

const txt =
'FLOAT PLAN\n\n' +
'Trip/Vessel: ' + $('floatName').value + '\n\n' +
'Notes:\n' + $('floatNotes').value + '\n\n' +
'Exported: ' + new Date().toLocaleString();

const blob = new Blob([txt], {type:'text/plain'});

const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'float_plan.txt';
a.click();
};


function renderWp(){
$('wpBody').innerHTML=waypoints.map(w=>
`<tr><td>${w.name}</td><td>${w.lat}</td><td>${w.lon}</td><td>${w.time}</td></tr>`
).join('');
}

$('wpAddBtn').onclick=()=>{
if(!gps){alert('Start GPS first');return;}
const wpDescriptor = $('wpName').value.trim() || 'WP';

waypoints.push({
name:wpDescriptor,
lat:gps.lat.toFixed(5),
lon:gps.lon.toFixed(5),
time:new Date().toLocaleTimeString()
});

$('wpName').value='';
renderWp();
};

$('wpExportBtn').onclick=()=>{
let csv='Name,Lat,Lon,Time\n';
waypoints.forEach(w=>{
csv+=`"${w.name}",${w.lat},${w.lon},"${w.time}"\n`;
});
const blob=new Blob([csv],{type:'text/csv'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='waypoints.csv';
a.click();
};

$('wpClearBtn').onclick=()=>{
waypoints=[];
renderWp();
};

$('wpSaveBtn').onclick=()=>{

localStorage.setItem('boaterWaypoints', JSON.stringify(waypoints));

alert('Waypoints saved');
};

$('wpLoadBtn').onclick=()=>{

const data = localStorage.getItem('boaterWaypoints');

if(!data){
alert('No saved waypoints found');
return;
}

try{
waypoints = JSON.parse(data);

if(!Array.isArray(waypoints)){
waypoints = [];
}

renderWp();

alert('Waypoints loaded');

}catch(err){

alert('Error loading waypoints');
}
};


applyLang();
</script>


<div style="text-align:center;padding:18px;color:#d0e6ff;font-size:12px">
© 2026 Glen Carruthers. All rights reserved.
</div>

</body>
</html>
